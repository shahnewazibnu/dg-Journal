<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="800" height="450" rx="16" fill="#ECEEEA"/><rect x="170" y="40" width="460" height="350" rx="14" fill="#FFFFFF" stroke="#D3D9D4"/><circle cx="400" cy="95" r="24" fill="#FCE8E6"/><text x="400" y="104" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#C5221F" text-anchor="middle" >!</text><text x="400" y="150" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E2A2F" text-anchor="middle" >Google hasn’t verified this app</text><text x="400" y="180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#56646A" text-anchor="middle" >This is your own private app (Digital Journal),</text><text x="400" y="200" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#56646A" text-anchor="middle" >so this message is expected.</text><rect x="260" y="240" width="130" height="34" rx="8" fill="#FFFFFF" stroke="#D3D9D4"/><text x="325.0" y="262" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E2A2F" text-anchor="middle" >Back to safety</text><rect x="410" y="240" width="130" height="34" rx="8" fill="#1E2A2F" stroke="#1E2A2F"/><text x="475.0" y="262" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ECEEEA" text-anchor="middle" >Continue</text><rect x="404" y="234" width="142" height="46" rx="12" fill="none" stroke="#E0600A" stroke-width="3"/><text x="400" y="320" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1E2A2F" text-anchor="middle" >If you only see “Advanced”, click it,</text><text x="400" y="342" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1E2A2F" text-anchor="middle" >then “Go to Digital Journal”.</text><text x="400.0" y="434" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#8A969A" text-anchor="middle" >Simplified drawing of Google’s sign-in screen.</text></svg>